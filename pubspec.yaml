name: storagio
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Utilities & Helpers
  logger: ^2.7.0                       # Application logging and debugging
  intl: ^0.20.2                        # Date, time, number formatting and localization support
  collection: ^1.19.1                  # Additional collection utilities and extensions
  crypto: ^3.0.7                       # Hashing and encryption utilities (SHA, MD5, etc.)
  uuid: ^4.5.3                         # Generate unique identifiers for database records

  # State Management
  flutter_riverpod: ^3.3.1             # State management and dependency injection

  # UI & Widgets
  animated_toggle_switch: ^0.8.7       # Animated toggle switch widget
  sign_button: ^2.0.6                  # Prebuilt social sign-in buttons (Google, Apple, etc.)
  flutter_slidable: ^3.1.0             # Swipe actions for list items (delete, edit, etc.)

  # Local Storage
  shared_preferences: ^2.5.5           # Store simple key-value settings locally
  sqflite: ^2.4.2+1                    # SQLite database for offline data storage
  path: ^1.9.1                         # File and directory path manipulation
  path_provider: ^2.1.5                # Access device storage directories

  # Image Handling
  image_picker: ^1.2.2                 # Select images from gallery or camera
  flutter_image_compress: ^2.4.0       # Compress images before storing or uploading

  # Firebase
  firebase_core: ^4.7.0                # Initialize Firebase services
  firebase_auth: ^6.4.0                # User authentication (Email, Google Sign-In, etc.)
  cloud_firestore: ^6.4.1              # Cloud database for backup and synchronization
  google_sign_in: ^7.2.0               # Google account authentication
  firebase_app_check: ^0.4.5+2         # Protects Firebase resources from unauthorized requests.

  # Network & Connectivity
  connectivity_plus: ^7.1.1            # Detect network connectivity status
  internet_connection_checker_plus: ^3.0.0 # Verify actual internet access availability

  # Notifications & Timezone
  flutter_local_notifications: ^21.0.0 # Schedule and display local notifications
  timezone: ^0.11.0                    # Timezone-aware notification scheduling
  flutter_native_timezone_latest: ^1.0.0 # Retrieve device timezone information

  # Permissions
  permission_handler: ^12.0.2          # Request and manage runtime permissions

  # Device info
  device_info_plus: ^13.2.0            # To check android version
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - res/icon/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

 
  fonts:
    - family: poppins
      fonts:
        - asset: res/fonts/Poppins-Regular.ttf
    - family: amaranth
      fonts:
        - asset: res/fonts/Amaranth-Regular.ttf
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
